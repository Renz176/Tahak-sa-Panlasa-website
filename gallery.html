<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="See a gallery of food, ingredients, and shared table moments from the Philippines."
    />
    <title>Gallery | Tahak sa Panlasa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <div class="logo">
        <a href="index.html"
          ><img src="img/logo.png" alt="Tahak sa Panlasa logo"
        /></a>
      </div>
      <div class="header-actions">
        <button
          class="menu-toggle"
          aria-label="Open navigation"
          aria-expanded="false"
        >
          ☰
        </button>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="dishes.html">Dishes</a>
          <a href="map.html">Map</a>
          <a href="culture.html">Culture</a>
          <a class="active" href="gallery.html">Gallery</a>
          <a href="builders.html">Builders</a>
        </nav>
        <button
          class="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
          aria-pressed="false"
        >
          <span class="theme-icon">☀️</span>
          <span class="theme-label">Light</span>
        </button>
      </div>
    </header>

    <main class="page-shell">
      <section class="page-hero section-pad">
        <p class="eyebrow"><span></span> A little taste of home</p>
        <h1>Gather around.</h1>
      </section>

      <section class="section-pad page-panel">
        <div class="gallery-grid">
          <figure class="gallery-large">
            <img
              src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=85"
              alt="Fresh Filipino ingredients"
            />
            <figcaption>Ingredients with a story</figcaption>
          </figure>
          <figure>
            <img
              src="https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=700&q=85"
              alt="Hands preparing Filipino dishes"
            />
            <figcaption>Made by hand</figcaption>
          </figure>
          <figure>
            <img
              src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=700&q=85"
              alt="Shared Filipino meal table"
            />
            <figcaption>Always shared</figcaption>
          </figure>
          <figure>
            <img
              src="https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&w=700&q=85"
              alt="Served Filipino dish"
            />
            <figcaption>Served with warmth</figcaption>
          </figure>
          <figure>
            <img
              src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=700&q=85"
              alt="A team cooking together"
            />
            <figcaption>Built with care</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2024 Tahak sa Panlasa</span>
      <span>Made with puso in the Philippines</span>
    </footer>

    <button class="back-to-top" type="button" aria-label="Back to top"></button>

    <script src="Javascript/script.js"></script>
  </body>
</html>
