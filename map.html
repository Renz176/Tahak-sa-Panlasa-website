<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore Filipino signature dishes by region on the Tahak sa Panlasa food map."
    />
    <title>Regional Food Map | Tahak sa Panlasa</title>
    <link href="css/style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <header class="site-header">
      <div class="logo">
        <a href="index.html"
          ><img src="img/logo.png" alt="Tahak sa Panlasa logo"
        /></a>
      </div>
      <div class="header-actions">
        <button
          class="menu-toggle"
          aria-label="Open navigation"
          aria-expanded="false"
        >
          ☰
        </button>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="dishes.html">Dishes</a>
          <a class="active" href="map.html" aria-current="page">Map</a>
          <a href="culture.html">Culture</a>
          <a href="gallery.html">Gallery</a>
          <a href="builders.html">Builders</a>
        </nav>
        <button
          class="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
          aria-pressed="false"
        >
          <span class="theme-icon">☀️</span>
          <span class="theme-label">Light</span>
        </button>
      </div>
    </header>

    <main>
      <section class="map-section">
        <div class="map-intro">
          <p class="eyebrow">Flavors across the islands</p>
          <h1>Regional Food Map of the Philippines</h1>
          <p>Select a pin to discover a signature dish from each region.</p>
        </div>
        <div
          id="leaflet-map"
          class="map-container"
          aria-label="Interactive map of Philippine regional foods"
        ></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="Javascript/script.js"></script>
  </body>
</html>
